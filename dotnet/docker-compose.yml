version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sla_db
      POSTGRES_USER: sla_user
      POSTGRES_PASSWORD: sla_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sla_user -d sla_db"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build:
      context: ..
      dockerfile: src/SlaBreach.Api/Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=sla_db;Username=sla_user;Password=sla_pass
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
volumes:
  db_data:
